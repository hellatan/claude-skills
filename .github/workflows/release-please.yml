name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  # The auto-merge gate reads the release PR's checks over REST as the built-in
  # token; without these the built-in GITHUB_TOKEN cannot see them. Declaring a
  # permissions block sets every unlisted scope to `none`, so they must be explicit.
  checks: read
  statuses: read

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6 # required for the local ./.github/actions/discord-alert composite

      - id: release
        uses: googleapis/release-please-action@v5
        with:
          # Author the release PR as a real identity, not github-actions[bot]:
          # GITHUB_TOKEN-authored PRs get no CI and park in action_required, so the
          # release PR never goes green on its own. Drop this only if you don't care
          # about CI on the release PR.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          # Releases are cut from main. Without this, the action defaults to the
          # repo's default branch (develop, per gitflow), so it opened its release
          # PR against develop and never tagged merges into main.
          target-branch: main
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json

      # verify-tag — folded in as steps (not a separate job) so it reuses this
      # runner. Final goal of the whole release setup: a merged release PR MUST
      # produce a tag. Catches the two failure modes a human watching the merge
      # only accidentally guarded against:
      #   1. the release-please step failed outright (loud), and
      #   2. a release PR merged, the step reported success, but NO tag was
      #      created — the silent freeze. The merged PR stays labelled
      #      `autorelease: pending`, which makes every later run abort with
      #      "There are untagged, merged release PRs outstanding" while still
      #      reporting green. Releases just stop and the repo looks healthy.
      #
      # Ground truth is the tag ref on the remote; the tag names come out of
      # toJSON(steps.release.outputs) — NEVER steps.release.outputs.release_created
      # /.tag_name. Those unprefixed outputs only exist when the manifest package
      # sits at the repo root: setPathOutput() in release-please-action namespaces
      # every per-package output as "<path>--<key>" for any other path, so a check
      # built on them cries "NO TAG created" on every healthy release.
      #
      # The freeze verdict comes from PROOF — a MERGED release PR still labelled
      # `autorelease: pending` — not from main's tip subject. The canonical copy of
      # these steps is skills/gh-actions-init/references/release-verification.md in
      # this repo; keep the two in sync, and re-run `npm run test:release-steps`
      # after touching either. That suite takes `--target` on a real workflow, so it
      # can be pointed at THIS file:
      #   python3 tests/release-steps/run_cases.py --target .github/workflows/release-please.yml
      - name: Evaluate release outcome
        id: check
        if: always()
        env:
          RELEASE_OUTCOME: ${{ steps.release.outcome }}
          OUTPUTS_JSON: ${{ toJSON(steps.release.outputs) }}
          HEAD_MSG: ${{ github.event.head_commit.message }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          alert=false
          title=""
          detail=""
          # released=true ONLY when this run cut a tag AND the tag ref is confirmed on
          # the remote (the `-n "$tags"` clean branch below). This repo has no deploy; the
          # consumer here is the auto-merge step's `if:` below, which skips on the
          # tag-cutting run so a stale release PR is never re-merged.
          released=false
          # frozen — set ONLY from the definitive freeze signature (a MERGED release PR
          # still labelled `autorelease: pending`). Kept separate from is_release_merge
          # because it is PROOF, not an inference from a commit subject, and the alert
          # branch below must not be able to lose it just because the commit message it
          # also wanted was unreadable.
          frozen=false
          # Set when we could not establish whether a release is frozen. That is NOT
          # the same as "nothing is frozen" — it alerts, see the branch below.
          lookup_failed=false
          lookup_err=""
          # The release branch's SHA, resolved ONLY on the frozen path below — the one
          # path whose verdict is read from that branch. github.sha is wrong there: on
          # a workflow_dispatch it is the tip of the DISPATCHED ref, and gitflow-init
          # makes `develop` the default branch, so the alert would quote main's release
          # subject while linking an unrelated develop commit.
          main_sha=""
          # The merged, still-pending release PR — the freeze proof itself. Named in
          # the alert, because it is the only actionable fact in it.
          stuck_pr=""
          # The commit the WINNING branch read its verdict from. Assigned only by the
          # branch that actually read main (the frozen one); every other branch leaves
          # it empty and the run's own SHA is emitted instead. main_sha alone would
          # leak into e.g. the tag-missing branch, whose verdict came from tag refs.
          verdict_sha=""
          # An event with no head_commit leaves HEAD_MSG empty, which would make the
          # silent-freeze branch below (release merged, no tag) unreachable — a green
          # run on the exact failure a manual re-fire exists to diagnose.
          #
          # The fix is NOT to read main's tip and adopt it as the head commit. main's
          # tip is a STATE, not an event: after every HEALTHY release main's tip IS the
          # release commit and matches the release-title pattern below, so adopting it
          # unconditionally sets is_release_merge on every dispatch against a resting,
          # healthy repo and fires the loudest alert in this file ("release PR merged
          # but NO TAG created") on the healthiest possible state.
          #
          # So the verdict comes from the freeze PROOF instead: a MERGED release PR
          # still carrying `autorelease: pending`. release-please relabels that to
          # `autorelease: tagged` the moment tagging succeeds, so a merged+pending PR
          # means the tag never happened. Same query release-health.yml sweeps with.
          # (Open+pending is the NORMAL state of an unmerged release PR — the
          # `--state merged` filter is what keeps this from matching it.)
          #
          # A non-empty result is SUFFICIENT on its own, so it sets `frozen` directly,
          # and main's tip is then read ONLY for a human-readable subject in the alert.
          # If that read fails the verdict still stands: a dispatch that PROVED a
          # freeze must never report green because a cosmetic follow-up call blipped.
          #
          # Keeping the proof separate is load-bearing for a second, deterministic
          # reason: the promotion PR is meant to land on main as a MERGE COMMIT
          # (.github/workflows/develop-to-main-pr.yml writes that instruction into the
          # PR body — it is advisory, nothing enforces it), so once any promotion
          # lands after the freeze, main's tip subject is
          # "Merge pull request #N from <owner>/develop"
          # — which matches neither the release-title pattern below nor a release
          # branch. Deriving the verdict from that message alone would report green on
          # the exact dispatch meant to unstick the release.
          #
          # Retried 3x like every other lookup here, and a lookup that fails all three
          # ALERTS rather than warning: `::warning::` neither fails the run nor reaches
          # Discord, so on the one run whose whole job is freeze detection, "we could
          # not tell" would be indistinguishable from "nothing is wrong".
          #
          # stderr goes to a FILE, never into the value: `2>&1` here would let any
          # advisory byte gh writes on an otherwise-successful call make `stuck_pr`
          # non-empty on a healthy repo, which then reads main's tip, matches the
          # release commit, and fires the very false alarm this gate exists to remove.
          #
          # `gh pr list` is GraphQL, and the auto-merge step below in this same
          # workflow deliberately uses REST instead — that rule is exempted here, not
          # forgotten. It exists because GraphQL quota is per-USER, which only bites
          # the PAT-authenticated calls; this step runs as GITHUB_TOKEN, whose budget
          # is per-REPO. release-health.yml queries the same way.
          if [ -z "$HEAD_MSG" ]; then
            err_file="${RUNNER_TEMP:-/tmp}/release-pr-lookup.err"
            lookup_ok=false
            for attempt in 1 2 3; do
              if stuck_pr=$(gh pr list --repo "$REPO" --state merged \
                --label "autorelease: pending" --limit 1 --json number \
                --jq '.[0].number // ""' 2>"$err_file"); then
                lookup_ok=true
                break
              fi
              # Truncated: this reaches Discord as an embed description, which Discord
              # caps at 4096 chars and rejects with HTTP 400 beyond it — a long gh
              # error would kill the alert on the one run that needed it.
              lookup_err=$(head -n 5 "$err_file" | cut -c1-400)
              stuck_pr=""
              echo "  merged release PR lookup FAILED (attempt ${attempt}/3): ${lookup_err}"
              if [ "$attempt" -lt 3 ]; then sleep 5; fi
            done

            if [ "$lookup_ok" != "true" ]; then
              lookup_failed=true
              # Logged plainly here; the ::error:: annotation is emitted from the
              # branch below, so a run that went on to cut and verify a tag — where a
              # blind freeze lookup is moot — does not carry a red annotation on an
              # otherwise perfect release.
              echo "Could not list merged release PRs after 3 attempts; freeze detection is blind this run."
            elif [ -n "$stuck_pr" ]; then
              frozen=true
              echo "No head_commit on this event; merged release PR #${stuck_pr} is still 'autorelease: pending' — the release IS frozen."
              # Cosmetic only — the verdict is already decided. ONE call reads both
              # fields: two calls can straddle a push to main and pair the subject of
              # commit N with the sha of N+1, and a second call that fails on its own
              # would silently drop main_sha, sending the alert back to $GITHUB_SHA —
              # the dispatched-ref mislink this exists to prevent. Retried like every
              # other lookup here, and stderr goes to a file so a failure is
              # diagnosable from the log.
              main_err="${RUNNER_TEMP:-/tmp}/release-main-tip.err"
              main_tsv=""
              for attempt in 1 2 3; do
                if main_tsv=$(gh api "repos/${REPO}/commits/main" \
                  --jq '[.sha, (.commit.message | split("\n")[0])] | @tsv' 2>"$main_err"); then
                  break
                fi
                main_tsv=""
                echo "  main tip read FAILED (attempt ${attempt}/3): $(cat "$main_err")"
                if [ "$attempt" -lt 3 ]; then sleep 5; fi
              done
              if [ -n "$main_tsv" ]; then
                main_sha=$(printf '%s' "$main_tsv" | cut -f1)
                HEAD_MSG=$(printf '%s' "$main_tsv" | cut -f2)
              else
                echo "::warning::Could not read main's tip commit after 3 attempts ($(cat "$main_err")); the alert names the release PR instead of the commit subject."
                HEAD_MSG="(main's tip commit was unreadable)"
              fi
            else
              echo "No head_commit on this event, and no merged release PR is stuck at 'autorelease: pending' — nothing is frozen."
            fi
          fi

          head_line=$(printf '%s\n' "$HEAD_MSG" | head -n1)

          # Did this push merge a release PR? The release commit's subject is rendered
          # from the config's pull-request-title-pattern, so it is NOT always
          # "chore: release X.Y.Z". The optional scope and component groups in the
          # pattern below are what carry that: drop either and this check goes
          # quietly dead. See "The release-merge regex must tolerate a component in
          # the title" in references/release-verification.md.
          is_release_merge=false
          if printf '%s' "$head_line" | grep -Eq '^chore(\([^)]*\))?: release +([^ ]+ +)?v?[0-9]+\.[0-9]+\.[0-9]+'; then
            is_release_merge=true
          fi

          # Every tag this run cut, whether the output key is the root `tag_name` or a
          # namespaced `<path>--tag_name`. Covers single-package, non-root package, and
          # per-component monorepo tags (backend-v1.2.0) without knowing the config.
          tags=$(printf '%s' "$OUTPUTS_JSON" | jq -r 'to_entries[] | select(.key | endswith("tag_name")) | .value | select(. != null and . != "")')
          context="releases_created=$(printf '%s' "$OUTPUTS_JSON" | jq -r '.releases_created // "<empty>"'), paths_released=$(printf '%s' "$OUTPUTS_JSON" | jq -r '.paths_released // "<empty>"')"

          # Ground truth is the ref on the remote. Retried, so ref propagation lag right
          # after the tag is cut can't manufacture a false alarm.
          missing=""
          for tag in $tags; do
            found=false
            for attempt in 1 2 3; do
              if gh api "repos/${REPO}/git/ref/tags/${tag}" >/dev/null 2>&1; then
                found=true
                break
              fi
              if [ "$attempt" -lt 3 ]; then sleep 5; fi
            done
            if [ "$found" = "true" ]; then
              echo "OK: tag ${tag} exists."
            else
              missing="${missing} ${tag}"
            fi
          done

          if [ "$RELEASE_OUTCOME" = "failure" ]; then
            alert=true
            title="❌ ${REPO} — release-please step failed"
            detail="The release-please action failed. No release PR / tag / release was produced this run."
          elif { [ "$is_release_merge" = "true" ] || [ "$frozen" = "true" ]; } && [ -z "$tags" ]; then
            alert=true
            title="🟥 ${REPO} — release PR merged but NO TAG created"
            if [ "$frozen" = "true" ]; then
              # The proof, not the commit subject. head_line here is main's TIP, which
              # after any later promotion is "Merge pull request #N from <owner>/develop"
              # — naming it would point at a commit that is not a release merge and
              # send the reader to a config that is fine.
              verdict_sha="$main_sha"
              detail="Merged release PR [#${stuck_pr}](${GITHUB_SERVER_URL}/${REPO}/pull/${stuck_pr}) is still labelled \`autorelease: pending\`, so it was never tagged — every future release is blocked until it is cleared (${context}). main's tip is currently \`${head_line}\`. Check the title-pattern/component config, then clear #${stuck_pr} once the tag exists."
            else
              detail="Merged \`${head_line}\` but release-please reported no tag (${context}). This is the silent freeze — check the title-pattern/component config."
            fi
          elif [ -n "$missing" ]; then
            alert=true
            title="🟥 ${REPO} — release reported but tag missing"
            detail="release-please reported tag(s):${missing} but the ref does not exist on the remote (${context})."
          elif [ -n "$tags" ]; then
            echo "OK: tagged $(printf '%s' "$tags" | tr '\n' ' ') (${context})."
            released=true
          elif [ "$lookup_failed" = "true" ]; then
            # Deliberately BELOW the tag branches: if this run cut and verified a tag,
            # the outcome is known and a failed freeze lookup is moot — which is also
            # why the ::error:: annotation is raised here and not at the lookup itself.
            alert=true
            echo "::error::Could not determine whether a release is frozen; freeze detection was blind this run."
            title="🟧 ${REPO} — could not determine whether a release is frozen"
            detail="This run had no head_commit (a manual dispatch), and listing merged \`autorelease: pending\` PRs failed on all 3 attempts — so freeze detection was blind. Nothing is known to be broken, but nothing is confirmed healthy either. Re-run, or check the release PRs by hand.
          \`\`\`
          ${lookup_err}
          \`\`\`"
          else
            echo "OK: no release expected this run (feature push or PR-only update)."
          fi

          # Randomised delimiter: `detail` can carry gh stderr, and a line in it equal
          # to the delimiter would truncate the value and spill the rest as unparsable
          # output lines — failing the step AFTER the verdict was computed, so the
          # alert never sends.
          delim="EOF_$(date +%s)_${RANDOM}"
          {
            echo "alert=$alert"
            echo "title=$title"
            echo "released=$released"
            # The commit the winning branch read its verdict from, falling back to this
            # run's own SHA. On a dispatch that fallback is the tip of the DISPATCHED
            # ref, which is exactly why the frozen branch sets verdict_sha to main's
            # SHA rather than relying on it.
            echo "commit_sha=${verdict_sha:-$GITHUB_SHA}"
            echo "detail<<${delim}"
            echo "$detail"
            echo "${delim}"
          } >> "$GITHUB_OUTPUT"

      # Auto-merge the release PR so a release is fully hands-off after the one
      # human gate (merging the develop→main promotion PR). On a promotion run,
      # release-please opens the "chore: release X.Y.Z" PR above; we wait for its
      # CI to go green, then squash-merge it here, which pushes to main and fires
      # a SECOND release-please.yml run that cuts the tag.
      #
      # Four load-bearing details:
      #  1. Merge with the PAT, not GITHUB_TOKEN. A GITHUB_TOKEN-authored merge
      #     push does NOT re-trigger workflows (GitHub's loop guard), so the
      #     tag+deploy run would never happen. Note this applies ONLY to the
      #     merge — see 4.
      #  2. Find the PR by its `autorelease: pending` label, NOT the action's
      #     `pr` output — release-please namespaces per-package outputs, so the
      #     bare `pr` output is unreliable (same reason the tag check above uses
      #     toJSON, not tag_name).
      #  3. WAIT FOR THE PR'S CHECKS. Merging this PR is what cuts the
      #     release tag, so merging before CI reports = tagging unverified code.
      #     GitHub's own gates cannot do this here: `allow_auto_merge` is off on
      #     this repo, and branch protection / required status checks are
      #     unavailable on a free-plan private repo — so `gh pr merge --auto`
      #     would either error outright or, with no *required* check to wait on,
      #     merge immediately anyway. The wait has to live in this step.
      #  4. READ the checks with GITHUB_TOKEN, over REST. Only the merge needs
      #     the PAT. Reading with it does not work and fails 100% of the time:
      #     RELEASE_PLEASE_TOKEN is a fine-grained PAT without `Checks: read`,
      #     so `gh pr view --json statusCheckRollup` returns
      #       GraphQL: Resource not accessible by personal access token
      #       (…pullRequest.statusCheckRollup.nodes.0.commit.statusCheckRollup)
      #     on every poll until the timeout. That is exactly how this shipped and
      #     it stalled release 0.30.2 for the full 30 minutes (run 30944579805) —
      #     the PAT had always been able to LIST and MERGE PRs, which is all it
      #     needed before a step here read check state.
      #     The built-in token reads them fine given `checks: read` +
      #     `statuses: read` in the permissions block above. REST rather than
      #     GraphQL for a second reason: GraphQL quota is per-USER, so a busy
      #     local `gh` session on the same account can drain the bucket the
      #     release gate depends on. GITHUB_TOKEN's REST budget is per-repo.
      # Skipped on the tag-cutting run (released == 'true') and when
      # release-please itself failed, so we never merge a stale release PR.
      #
      # The poll refuses to merge in three cases. Each leaves the release PR
      # OPEN and alerts gh_errors — an open release PR is safe (release-please
      # just updates it on the next run) but it is also silent: release-health's
      # daily sweep only flags MERGED+pending PRs, so nothing else would catch a
      # release that stopped here.
      #   - a check failed                        → red code must not be tagged
      #   - no checks registered within the grace  → merging with zero CI is the
      #     exact bug this guards against, so silence is treated as failure
      #   - checks still running at the timeout    → never block the runner forever
      #
      # Checks register a few seconds apart, so an immediate "all green" read can
      # pass vacuously (one fast job finished, the slow ones not posted yet).
      # Green is therefore only accepted once the observed check-name SET has been
      # unchanged for CHECKS_SETTLE_SECONDS. Failures are acted on immediately.
      #
      # PAUSE SWITCH: set the repo variable RELEASE_AUTOMERGE=false to keep the
      # release PR OPEN for manual review — e.g. to eyeball the version bump
      # after a release-please config change before it tags. Unset (or
      # anything but 'false') = auto-merge on. This gates ONLY the automatic
      # merge; when you merge the PR yourself, the tag still fires.
      # Repos with slower CI can raise the wait with the repo variable
      # RELEASE_CHECKS_TIMEOUT_SECONDS.
      - name: Auto-merge the release PR
        id: automerge
        if: ${{ steps.release.outcome == 'success' && steps.check.outputs.released != 'true' && vars.RELEASE_AUTOMERGE != 'false' }}
        env:
          # Reads run as the built-in token (needs checks:read + statuses:read).
          # The PAT is deliberately NOT the ambient GH_TOKEN — it cannot read
          # check state at all, and using it here is what stalled 0.30.2.
          GH_TOKEN: ${{ github.token }}
          MERGE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          REPO: ${{ github.repository }}
          CHECKS_TIMEOUT_SECONDS: ${{ vars.RELEASE_CHECKS_TIMEOUT_SECONDS || '1800' }}
          CHECKS_GRACE_SECONDS: "180"
          CHECKS_SETTLE_SECONDS: "60"
          CHECKS_POLL_SECONDS: "15"
        run: |
          alert=false
          title=""
          detail=""
          emit() {
            {
              echo "alert=$alert"
              echo "title=$title"
              echo "detail<<EOF"
              echo "$detail"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          }

          # REST, not `gh pr list` — that is GraphQL, and GraphQL quota is
          # per-user rather than per-repo (see detail 4 above).
          pr=""
          for attempt in 1 2 3; do
            pr=$(gh api "repos/${REPO}/pulls?state=open&base=main&per_page=100" \
              --jq 'map(select(any(.labels[]?; .name == "autorelease: pending")))[0].number // empty' 2>/dev/null || true)
            if [ -n "$pr" ]; then break; fi
            echo "No pending release PR yet (attempt ${attempt}/3), retrying in 5s..."
            sleep 5
          done
          if [ -z "$pr" ]; then
            echo "No pending release PR to auto-merge this run."
            emit
            exit 0
          fi

          pr_url="${GITHUB_SERVER_URL}/${REPO}/pull/${pr}"
          echo "Release PR #${pr} — waiting for its checks (timeout ${CHECKS_TIMEOUT_SECONDS}s)"

          started=$(date +%s)
          seen=""
          stable_since=$started
          outcome=""
          reason=""

          while :; do
            now=$(date +%s)
            elapsed=$((now - started))

            # Re-read the head SHA every poll: release-please can push a new
            # commit to the release PR mid-wait, which restarts its checks.
            # Polling a stale SHA would report the OLD run's results as green.
            # A transient API blip must not be read as "no checks" — retry instead.
            if ! sha=$(gh api "repos/${REPO}/pulls/${pr}" --jq '.head.sha' 2>&1); then
              echo "  [${elapsed}s] could not read the PR head: ${sha}"
              if [ "$elapsed" -ge "$CHECKS_TIMEOUT_SECONDS" ]; then
                outcome=timeout
                reason="Could not read the release PR before the ${CHECKS_TIMEOUT_SECONDS}s timeout."
                break
              fi
              sleep "$CHECKS_POLL_SECONDS"
              continue
            fi

            # Two separate REST endpoints, because they cover different things and
            # a repo can use either: /check-runs is Actions + GitHub Apps (what CI
            # reports here); /status is legacy commit statuses, still emitted by
            # some older integrations. Both are normalised to "<class>\t<name>".
            if ! runs_json=$(gh api "repos/${REPO}/commits/${sha}/check-runs?per_page=100" 2>&1) \
               || ! status_json=$(gh api "repos/${REPO}/commits/${sha}/status" 2>&1); then
              echo "  [${elapsed}s] could not read check status: ${runs_json}${status_json}"
              if [ "$elapsed" -ge "$CHECKS_TIMEOUT_SECONDS" ]; then
                outcome=timeout
                reason="Could not read check status before the ${CHECKS_TIMEOUT_SECONDS}s timeout."
                break
              fi
              sleep "$CHECKS_POLL_SECONDS"
              continue
            fi

            # A check run with no conclusion yet is pending, whatever its status
            # says. Legacy statuses have no status field at all — only .state.
            classified=$(
              printf '%s' "$runs_json" | jq -r '
                .check_runs[]? |
                (if (.status != "completed") or ((.conclusion // "") == "") then "pending"
                 elif (.conclusion | . == "success" or . == "neutral" or . == "skipped") then "success"
                 else "failure" end) as $cls |
                "\($cls)\t\(.name // "unnamed")"'
              printf '%s' "$status_json" | jq -r '
                .statuses[]? |
                (if (.state == "pending" or (.state // "") == "") then "pending"
                 elif (.state == "success") then "success"
                 else "failure" end) as $cls |
                "\($cls)\t\(.context // "unnamed")"'
            )

            total=$(printf '%s' "$classified" | grep -c . || true)
            pending=$(printf '%s' "$classified" | grep -c '^pending' || true)
            failing=$(printf '%s' "$classified" | awk -F'\t' '$1=="failure"{print $2}' | paste -sd, - || true)
            names=$(printf '%s' "$classified" | awk -F'\t' '{print $2}' | sort | tr '\n' ',')

            if [ "$names" != "$seen" ]; then
              seen="$names"
              stable_since=$now
            fi
            echo "  [${elapsed}s] checks=${total} pending=${pending} failing='${failing}' stable_for=$((now - stable_since))s"

            if [ -n "$failing" ]; then
              outcome=failed
              reason="Failing check(s): ${failing}."
              break
            fi

            if [ "$total" -eq 0 ]; then
              if [ "$elapsed" -ge "$CHECKS_GRACE_SECONDS" ]; then
                outcome=nochecks
                reason="No checks registered on the release PR within ${CHECKS_GRACE_SECONDS}s. Refusing to merge an unverified release."
                break
              fi
            elif [ "$pending" -eq 0 ] && [ $((now - stable_since)) -ge "$CHECKS_SETTLE_SECONDS" ]; then
              outcome=green
              break
            fi

            if [ "$elapsed" -ge "$CHECKS_TIMEOUT_SECONDS" ]; then
              outcome=timeout
              reason="Checks did not finish within ${CHECKS_TIMEOUT_SECONDS}s (${pending} still pending: ${names%,})."
              break
            fi

            sleep "$CHECKS_POLL_SECONDS"
          done

          if [ "$outcome" != "green" ]; then
            alert=true
            title="🟧 ${REPO} — release PR NOT auto-merged (checks ${outcome})"
            detail="Release PR [#${pr}](${pr_url}) was left **open** — no tag, no release. ${reason}"
            echo "::error::${reason} Release PR #${pr} left open."
            emit
            exit 0
          fi

          # ONLY this call uses the PAT — a GITHUB_TOKEN-authored merge push
          # would not re-trigger the workflow that cuts the tag (detail 1).
          echo "All ${total} checks green. Auto-merging release PR #${pr} with the release PAT"
          if ! merge_err=$(GH_TOKEN="$MERGE_TOKEN" gh pr merge "$pr" --repo "$REPO" --squash --delete-branch 2>&1); then
            alert=true
            title="🟧 ${REPO} — release PR merge failed"
            detail="Release PR [#${pr}](${pr_url}) passed CI but the squash-merge failed, so it was left **open** — no tag, no release.
          \`\`\`
          ${merge_err}
          \`\`\`"
            echo "::error::Failed to merge release PR #${pr}: ${merge_err}"
            emit
            exit 0
          fi
          echo "Merged release PR #${pr}."
          emit

      # Separate from the tag-verification alert below: this one means the release
      # STOPPED cleanly (PR open, nothing tagged), not that a
      # release went missing. Different fix, different message — but equally loud,
      # because no other job flags an open release PR.
      - name: Alert gh_errors — release PR left open
        if: ${{ always() && steps.automerge.outputs.alert == 'true' }}
        uses: ./.github/actions/discord-alert
        with:
          webhook: ${{ secrets.DISCORD_GH_ERRORS_WEBHOOK }}
          title: ${{ steps.automerge.outputs.title }}
          description: |
            ${{ steps.automerge.outputs.detail }}

            Fix the failure, then merge the release PR yourself — the tag still fires on merge.
            **Repo:** ${{ github.server_url }}/${{ github.repository }}
            [View run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) · [Release PRs](${{ github.server_url }}/${{ github.repository }}/pulls?q=is%3Apr+label%3A%22autorelease%3A+pending%22)

      - name: Alert on failure
        if: ${{ always() && steps.check.outputs.alert == 'true' }}
        uses: ./.github/actions/discord-alert
        with:
          webhook: ${{ secrets.DISCORD_GH_ERRORS_WEBHOOK }}
          title: ${{ steps.check.outputs.title }}
          description: |
            ${{ steps.check.outputs.detail }}

            **Commit:** [`${{ steps.check.outputs.commit_sha }}`](${{ github.server_url }}/${{ github.repository }}/commit/${{ steps.check.outputs.commit_sha }})
            **Repo:** ${{ github.server_url }}/${{ github.repository }}
            [View run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) · [Release PRs](${{ github.server_url }}/${{ github.repository }}/pulls?q=is%3Apr+label%3A%22autorelease%3A+pending%22)

      - name: Fail the run if a release was expected but missing
        if: ${{ always() && (steps.check.outputs.alert == 'true' || steps.automerge.outputs.alert == 'true') }}
        run: |
          echo "::error::release verification failed or the release PR was left open — see the gh_errors alert"
          exit 1
