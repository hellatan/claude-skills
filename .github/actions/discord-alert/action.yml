name: discord-alert
description: Record an alert on the run summary, and push it to Discord when a webhook is configured.

inputs:
  webhook:
    description: Discord webhook URL (pass secrets.DISCORD_GH_ERRORS_WEBHOOK)
    required: true
  title:
    description: Embed title
    required: true
  description:
    description: Embed description (Discord markdown)
    required: true
  color:
    description: Embed sidebar color (decimal). Default red.
    required: false
    default: "15158332"

runs:
  using: composite
  steps:
    - shell: bash
      env:
        WEBHOOK: ${{ inputs.webhook }}
        TITLE: ${{ inputs.title }}
        DESC: ${{ inputs.description }}
        COLOR: ${{ inputs.color }}
      run: |
        # Record the alert on the run itself FIRST, before any webhook call and
        # regardless of whether one is configured. The webhook is a push
        # channel, not the system of record: a repo with no webhook — or one
        # whose webhook was revoked — must still be able to find out what
        # happened, from the run page, with no external service involved.
        # Previously an unset webhook logged only the title, so the detail
        # (which PRs, which checks) was discarded entirely.
        if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
          {
            echo "### ${TITLE}"
            echo
            echo "${DESC}"
            echo
          } >> "$GITHUB_STEP_SUMMARY"
        fi

        if [ -z "$WEBHOOK" ]; then
          echo "::warning::${TITLE} — no alert webhook configured, so this was not sent to Discord. Full detail is in this run's summary."
          exit 0
        fi
        payload=$(jq -n --arg t "$TITLE" --arg d "$DESC" --argjson c "${COLOR:-15158332}" \
          '{embeds:[{title:$t, description:$d, color:$c}]}')
        code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
          -H 'Content-Type: application/json' "$WEBHOOK" -d "$payload")
        echo "discord webhook responded: $code"
        case "$code" in
          2*) echo "alert delivered" ;;
          *)  echo "::error::discord webhook failed (HTTP $code)"; exit 1 ;;
        esac
